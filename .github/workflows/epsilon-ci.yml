name: Epsilon-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-gcc
          - os: ubuntu-latest
            preset: ci-clang
          - os: windows-latest
            preset: ci-msvc

    steps:
    - uses: actions/checkout@v5

    - name: Install libc++ on Ubuntu
      if: matrix.preset == 'ci-clang'
      run: sudo apt-get install libc++-dev libc++abi-dev

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }} -S src

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v5

    - name: Install gcovr
      run: pip install gcovr

    - name: Configure CMake
      run: cmake --preset ci-coverage -S src

    - name: Build
      run: cmake --build --preset ci-coverage

    - name: Test
      run: ctest --preset ci-coverage

    - name: Generate coverage report
      run: |
        mkdir -p coverage
        gcovr --root src \
          --filter 'src/epsilon/' \
          --filter 'src/engine/' \
          --exclude 'src/ut/' \
          --html-details coverage/index.html \
          --xml coverage/coverage.xml \
          --print-summary \
          b/ci-coverage

    - name: Post coverage summary
      if: always()
      run: |
        echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        gcovr --root src \
          --filter 'src/epsilon/' \
          --filter 'src/engine/' \
          --exclude 'src/ut/' \
          --print-summary \
          b/ci-coverage 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: coverage/
