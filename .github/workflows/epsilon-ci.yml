name: Epsilon-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-gcc
          - os: ubuntu-latest
            preset: ci-clang
          - os: windows-latest
            preset: ci-msvc

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Install libc++ on Ubuntu
      if: matrix.preset == 'ci-clang'
      run: sudo apt-get install libc++-dev libc++abi-dev

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v6
      with:
        name: cli-${{ matrix.preset }}
        path: |
          src/b/${{ matrix.preset }}/cli/cli
          src/b/${{ matrix.preset }}/cli/Release/cli.exe

    - name: Test
      run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Install gcovr
      run: pip install gcovr

    - name: Configure CMake
      run: cmake --preset ci-coverage

    - name: Build
      run: cmake --build --preset ci-coverage

    - name: Test
      run: ctest --preset ci-coverage

    - name: Generate coverage report
      run: |
        mkdir -p coverage
        gcovr --root . \
          --filter 'epsilon/' \
          --filter 'engine/' \
          --exclude 'ut/' \
          --html-details coverage/index.html \
          --xml coverage/coverage.xml \
          --print-summary \
          b/ci-coverage

    - name: Post coverage summary
      if: always()
      run: |
        echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        gcovr --root . \
          --filter 'epsilon/' \
          --filter 'engine/' \
          --exclude 'ut/' \
          --print-summary \
          b/ci-coverage 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: src/coverage/

  release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Read version from VERSION file
      shell: pwsh
      run: |
        $ver = (Get-Content VERSION).Trim()
        echo "VERSION=$ver" >> $env:GITHUB_ENV

    - name: Validate tag matches VERSION file
      shell: pwsh
      run: |
        $tagVer = "${{ github.ref_name }}" -replace '^v', ''
        $fileVer = "${{ env.VERSION }}"
        if ($tagVer -ne $fileVer) {
          Write-Error "Tag v$tagVer does not match VERSION file ($fileVer)"
          exit 1
        }

    - name: Configure CMake
      run: cmake --preset vs-rel

    - name: Build
      run: cmake --build --preset vs-rel --config Release

    - name: Build MSIX
      shell: pwsh
      run: .\msix\build-and-pack.ps1 -Version "${{ env.VERSION }}"

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v6
      with:
        name: epsilon-${{ env.VERSION }}-win-x64
        path: src/msix/*.msix

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Epsilon ${{ env.VERSION }}"
        files: src/msix/*.msix
        generate_release_notes: true
